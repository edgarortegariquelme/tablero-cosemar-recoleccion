# Cada ~25 minutos (cadena propia + horarios de respaldo): lee Gmail (correos, manifolds y revisiones técnicas de Cosemar/ITS), regenera la app y avisa por correo SOLO si hay algo nuevo.
# Secretos (Settings → Secrets and variables → Actions): GMAIL_PUENTE_URL (enlace del puente de Apps Script, acciones/puente_gmail.gs),
# AVISOS_CC (opcional, @maho.cl). Alternativa con contraseña de aplicación: GMAIL_USUARIO, GMAIL_CLAVE_APP, AVISOS_PARA, NOTION_TOKEN (opcional: si está, el libro de control se toma de Notion).
# Sin secretos la app igual se reconstruye; solo se omiten la lectura de Gmail y el correo.
name: Actualizar app Cosemar
on:
  # Tres capas para no depender del horario de GitHub, que en la práctica descarta muchas corridas programadas:
  # 1) cadena propia: cada corrida programa la siguiente (job «siguiente»); 2) horarios de respaldo, que reinician la cadena
  # si se corta; 3) el mantenimiento automático de Claude (dos veces al día) revisa la frescura y la dispara si hace falta.
  schedule:
    - cron: '17 * * * *'
    - cron: '47 * * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['datos/**', 'tablero/draft/**', 'tablero/store/*.json', 'acciones/**']
permissions:
  contents: write
  actions: write
concurrency:
  group: app-cosemar
  cancel-in-progress: false
jobs:
  construir:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - name: Herramientas para leer certificados (PDF y OCR)
        run: sudo apt-get install -y -q poppler-utils tesseract-ocr tesseract-ocr-spa >/dev/null
      - name: Dependencias
        run: npm ci --no-audit --no-fund
      - name: Exportar libro de control desde Notion (si hay token)
        env: { NOTION_TOKEN: '${{ secrets.NOTION_TOKEN }}' }
        run: node datos/exportar_notion.js
      - name: Gmail → datos → app → avisos
        env:
          GMAIL_PUENTE_URL: ${{ secrets.GMAIL_PUENTE_URL }}
          GMAIL_USUARIO: ${{ secrets.GMAIL_USUARIO }}
          GMAIL_CLAVE_APP: ${{ secrets.GMAIL_CLAVE_APP }}
          AVISOS_PARA: ${{ secrets.AVISOS_PARA }}
          AVISOS_CC: ${{ secrets.AVISOS_CC }}
        run: node acciones/vigilante.js
      - name: Guardar cambios
        run: |
          git config user.name "app-cosemar"
          git config user.email "actions@users.noreply.github.com"
          git checkout -- entregables 2>/dev/null || true   # el archivo descargable (2,9 MB) no se guarda en cada corrida
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "app: datos actualizados $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do
            if git pull --rebase --autostash -q; then git push && break; fi
            # Choque con otro commit (por ejemplo, un cambio de código simultáneo). Si solo hay archivos generados en conflicto,
            # se toma la versión de esta corrida, se regenera la app y se guarda; si hay código en conflicto, se aborta sin forzar.
            C=$(git diff --name-only --diff-filter=U)
            if echo "$C" | grep -qvE '^(docs/|tablero/store/|datos/auto/|entregables/)'; then git rebase --abort; echo "Conflicto en código: se deja para revisión"; exit 1; fi
            git checkout --theirs -- $C && git add -A && GIT_EDITOR=true git rebase --continue
            node datos/operacion.js >/dev/null && node datos/construir_app.js && git checkout -- entregables 2>/dev/null || true
            git add -A && (git diff --cached --quiet || git commit -q -m "app: regenerada tras integrar cambios") && git push && break
            sleep 5
          done
  # Cadena propia: espera y dispara la siguiente corrida. La concurrencia del grupo deja a lo más una en espera,
  # así que la cadena no se duplica aunque también lleguen corridas por horario o a mano.
  siguiente:
    needs: construir
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Esperar y programar la próxima corrida
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          sleep 1200
          gh workflow run actualizar-app.yml --repo "$REPO" --ref main
